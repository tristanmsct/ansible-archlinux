---
- name: Install CLI tools
  community.general.pacman:
    name:
      - moreutils
      - yazi
      - neovim
      - vim-runtime
      - fzf
      - zoxide
      - fd
      - eza
      - bat
      - git-delta
      - ripgrep
      - ncdu
      - dust
      - glow
      - tldr
      - thefuck
      - btop
      - duf
      - python-networkx  # For jaccuse script
    state: present
    update_cache: yes
  become: true

- name: Install trash-cli
  community.general.pacman:
    name:
      - trash-cli
    state: present
    update_cache: yes
  become: true

- name: Start trash-cli service
  ansible.builtin.systemd_service:
    name: empty-trash.timer
    enabled: true
    scope: user

- name: Install other usefull cli tools
  community.general.pacman:
    name:
      - wget
      - wtype
      - zip
      - unzip
      - yt-dlp
      - ckbcomp
      - fastfetch
      - ddcutil
      - figlet
      - gum
      - imagemagick
      - jq
      - tk
      - python-argon2-cffi
      - nano
    state: present
    update_cache: yes
  become: true

- name: Enable ssh-agent socket
  ansible.builtin.systemd:
    name: ssh-agent.socket
    scope: user
    enabled: true
    state: started
