---
- name: Ensure journald drop-in dir exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: yes

- name: Configure journald with a drop-in
  ansible.builtin.template:
    src: journald/custom.conf.j2
    dest: /etc/systemd/journald.conf.d/custom.conf
    owner: root
    group: root
    mode: '0644'
  become: yes
  notify:
    - daemon reload
    - restart journald
